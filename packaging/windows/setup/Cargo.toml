[package]
name = "ymusic-setup"
version = "0.3.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "ymusic-setup"
path = "src/main.rs"

[[bin]]
name = "ymusic-packer"
path = "src/bin/packer.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.19", default-features = false, features = ["compat-1-2", "std", "backend-winit", "renderer-software"] }
tar = "0.4"
zstd = "0.13"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"
