<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Контейнер MD3 Surface -->
    <linearGradient id="md3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1B1C" />
      <stop offset="100%" stop-color="#141314" />
    </linearGradient>

    <!-- Основной акцент (MD3 Primary / Accent) -->
    <linearGradient id="md3-primary" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#EBDCEB" />
      <stop offset="100%" stop-color="#D1C2D2" />
    </linearGradient>
  </defs>

  <!-- Подложка Squircle -->
  <rect x="16" y="16" width="224" height="224" rx="64" fill="url(#md3-bg)" stroke="#494648" stroke-width="4" />

  <!-- Задний тональный слой (мягкая пухлая форма MD3 Cookie сверху-справа) -->
  <path d="M 150 56
       C 168 56, 174 74, 190 70
       C 208 66, 218 84, 208 100
       C 198 116, 224 126, 218 146
       C 212 164, 188 164, 180 182
       C 172 200, 146 196, 132 182
       C 112 162, 102 128, 114 96
       C 124 72, 134 56, 150 56 Z" fill="#D1C2D2" opacity="0.22" />

  <!-- Передний слой: плавная 8-лучевая искра MD3 -->
  <path d="M 140 50
       Q 152 44 156 58
       Q 162 84 184 68
       Q 198 58 198 74
       Q 196 98 220 98
       Q 236 98 226 112
       Q 206 132 226 150
       Q 238 162 222 168
       Q 190 176 198 208
       Q 202 224 186 216
       Q 154 196 134 236
       Q 124 252 118 234
       Q 110 190 66 210
       Q 48 218 56 200
       Q 80 156 36 136
       Q 18 128 38 118
       Q 86 102 68 68
       Q 60 52 78 60
       Q 118 82 140 50
       Z" fill="url(#md3-primary)" />

  <!-- Внутренний блик-капля (смещённый к центру тяжести справа-сверху) -->
  <path d="M 152 96
       Q 176 96 176 120
       Q 176 146 146 152
       Q 120 156 124 128
       Q 128 96 152 96 Z" fill="#F7EFF6" opacity="0.6" />
</svg>
