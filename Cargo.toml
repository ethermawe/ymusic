[package]
name = "ymusic"
version = "0.1.0"
edition = "2024"

[lib]
name = "ymusic_core"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
md5 = "0.8.1"
parking_lot = "0.12.5"
thiserror = "2.0.21"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2", "form"] }
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "mp4", "flac"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "sync", "time", "net", "fs", "io-util", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["async-io"] }
keyring-core = "1.0.0"
zbus-secret-service-keyring-store = { version = "1.0.0", features = ["rt-async-io-crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
