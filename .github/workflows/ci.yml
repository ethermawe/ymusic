name: CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          python-version: '3.12'
          modules: 'qtshadertools qtsvg qtdeclarative'

      - name: Run Rust unit tests
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/xdg-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/xdg-config
          XDG_CACHE_HOME: ${{ runner.temp }}/xdg-cache
        run: cargo test --locked --lib

      - name: Build Rust core (release)
        run: cargo build --release --locked --lib

      - name: Configure Qt frontend
        run: cmake -S src-qt -B build-qt -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build Qt frontend
        run: cmake --build build-qt

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          python-version: '3.12'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools qtsvg qtdeclarative'

      - name: Run Rust unit tests
        run: cargo test --locked --lib

      - name: Build Rust core (release)
        run: cargo build --release --locked --lib

      - name: Configure and build Qt frontend
        run: |
          cmake -S src-qt -B build-qt -A x64
          cmake --build build-qt --config Release
          cmake --install build-qt --config Release --prefix dist

      - name: Deploy Qt runtime (windeployqt)
        run: windeployqt --qmldir src-qt/qml --release dist/ymusic-qml.exe

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ymusic-windows-x86_64
          path: dist/
