name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtshadertools'

      - name: Build Rust core (release)
        run: cargo build --release --locked --lib

      - name: Configure and build Qt frontend
        run: |
          cmake -S src-qt -B build-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build-qt

      - name: Stage and archive release bundle
        run: |
          DESTDIR="$PWD/dist" cmake --install build-qt
          tar -C dist -czf "ymusic-${{ github.ref_name }}-linux-x86_64.tar.gz" usr

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ymusic-${{ github.ref_name }}-linux-x86_64.tar.gz

  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'

      - name: Build Rust core (release)
        run: cargo build --release --locked --lib

      - name: Configure and build Qt frontend
        run: |
          cmake -S src-qt -B build-qt -A x64
          cmake --build build-qt --config Release
          cmake --install build-qt --config Release --prefix dist

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          windeployqt --qmldir src-qt/qml --release --no-translations --no-opengl-sw dist/ymusic-qml.exe
          Remove-Item -Recurse -Force dist/qmltooling -ErrorAction SilentlyContinue

      - name: Build single-file portable EXE (NSIS)
        shell: pwsh
        run: |
          $exeName = "ymusic-${{ github.ref_name }}-windows-x86_64.exe"
          @"
          OutFile "$exeName"
          SilentInstall silent
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          Section
            InitPluginsDir
            SetOutPath "`$PLUGINSDIR"
            File /r "dist\*.*"
            ExecWait '"`$PLUGINSDIR\ymusic-qml.exe"'
          SectionEnd
          "@ | Set-Content -Encoding ASCII portable.nsi
          & "C:\Program Files (x86)\NSIS\makensis.exe" portable.nsi

      - name: Archive Windows bundle
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath "ymusic-${{ github.ref_name }}-windows-x86_64.zip"

      - name: Attach Windows artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ymusic-${{ github.ref_name }}-windows-x86_64.exe
            ymusic-${{ github.ref_name }}-windows-x86_64.zip
