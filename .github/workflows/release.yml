name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.3)'
        required: true
        default: 'v0.2.3'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

  build-linux:
    needs: meta
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            zstd

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          modules: 'qtshadertools'

      - name: Build Rust core (release)
        run: cargo build --release --locked --lib

      - name: Configure and build Qt frontend
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          cmake -S src-qt -B build-qt -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DYMUSIC_VERSION="${TAG#v}"
          cmake --build build-qt

      - name: Stage and archive release bundles
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          DESTDIR="$PWD/dist" cmake --install build-qt
          mkdir -p out
          tar -C dist -czf "out/ymusic-${TAG}-linux-x86_64.tar.gz" usr
          tar -C dist --zstd -cf "out/ymusic-${TAG}-linux-x86_64.tar.zst" usr

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: out/

  build-arch:
    needs: meta
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Build Arch Linux .pkg.tar.zst
        run: |
          TAG="${{ needs.meta.outputs.tag }}"
          PKGVER="${TAG#v}"
          PKGVER="${PKGVER//-/_}"
          docker run --rm -e PKGVER="$PKGVER" -v "$PWD:/work" -w /work archlinux:latest bash -euo pipefail -c '
            pacman -Syu --noconfirm --needed base-devel git rust cmake ninja pkgconf alsa-lib qt6-base qt6-declarative qt6-svg qt6-shadertools hicolor-icon-theme
            useradd -m builder
            sed -i "s/^pkgver=.*/pkgver=$PKGVER/" PKGBUILD
            chown -R builder:builder /work
            su - builder -c "cd /work && makepkg -sf --noconfirm"
            mkdir -p /work/out-arch
            cp /work/*.pkg.tar.zst /work/out-arch/
          '

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: out-arch/*.pkg.tar.zst

  build-windows:
    needs: meta
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2022_64'
          modules: 'qtshadertools'

      - name: Build Rust core (release)
        run: cargo build --release --locked --lib

      - name: Configure and build Qt frontend
        shell: pwsh
        run: |
          $tag = "${{ needs.meta.outputs.tag }}"
          $ver = $tag.TrimStart('v')
          cmake -S src-qt -B build-qt -A x64 "-DYMUSIC_VERSION=$ver"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build-qt --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --install build-qt --config Release --prefix dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Deploy Qt runtime (windeployqt)
        shell: pwsh
        run: |
          windeployqt --qmldir src-qt/qml --release --no-translations --no-opengl-sw --no-compiler-runtime dist/ymusic-qml.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force dist/qmltooling -ErrorAction SilentlyContinue

          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vsPath) { throw "Could not locate Visual Studio installation via vswhere.exe" }
          $crtDir = Get-ChildItem -Path "$vsPath\VC\Redist\MSVC" -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '^\d' } |
            Sort-Object Name -Descending |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" }
          if (-not $crtDir -or -not (Test-Path $crtDir)) {
            $crtDir = Get-ChildItem -Path "$vsPath\VC\Redist\MSVC" -Recurse -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $crtDir -or -not (Test-Path $crtDir)) {
            throw "Could not find MSVC x64 CRT directory under $vsPath"
          }
          Copy-Item "$crtDir\*.dll" -Destination "dist\" -Force
          if (-not (Test-Path "dist\vcruntime140_1.dll") -or -not (Test-Path "dist\msvcp140.dll")) {
            throw "Missing required MSVC CRT DLLs in dist/"
          }

      - name: Build Windows installer (NSIS) and update manifest
        shell: pwsh
        run: |
          $tag = "${{ needs.meta.outputs.tag }}"
          $ver = $tag.TrimStart('v')
          $root = (Get-Location).Path
          New-Item -ItemType Directory -Force -Path "$root\out" | Out-Null
          $setupName = "ymusic-$tag-windows-x86_64-setup.exe"
          $setupPath = "$root\out\$setupName"
          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            "/DAPP_VERSION=$ver" `
            "/DDIST_DIR=$root\dist" `
            "/DOUT_FILE=$setupPath" `
            "/DICON_FILE=$root\icons\ymusic.ico" `
            "packaging\windows\installer.nsi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $hash = (Get-FileHash -Path $setupPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version   = $ver
            tag       = $tag
            url       = "https://github.com/${{ github.repository }}/releases/download/$tag/$setupName"
            sha256    = $hash
            notes_url = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8NoBOM "$root\out\latest-windows.json"

      - name: Build single-file portable EXE (NSIS)
        shell: pwsh
        run: |
          $tag = "${{ needs.meta.outputs.tag }}"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exeName = "out/ymusic-$tag-windows-x86_64.exe"
          @"
          Icon "icons\ymusic.ico"
          OutFile "$exeName"
          SilentInstall silent
          RequestExecutionLevel user
          SetCompressor /SOLID lzma
          Section
            InitPluginsDir
            SetOutPath "`$PLUGINSDIR"
            File /r "dist\*.*"
            ExecWait '"`$PLUGINSDIR\ymusic-qml.exe"'
          SectionEnd
          "@ | Set-Content -Encoding ASCII portable.nsi
          & "C:\Program Files (x86)\NSIS\makensis.exe" portable.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Archive Windows bundle
        shell: pwsh
        run: |
          $tag = "${{ needs.meta.outputs.tag }}"
          Compress-Archive -Path dist/* -DestinationPath "out/ymusic-$tag-windows-x86_64.zip"

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/

  release:
    needs: [meta, build-linux, build-arch, build-windows]
    runs-on: ubuntu-24.04

    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          generate_release_notes: true
          files: release-assets/*
